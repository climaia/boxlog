<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>BoxLog</title>
<meta name="theme-color" content="#0A3D91">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --fondo: #E4E8EC; --superficie: #FFFFFF; --superficie-2: #F2F5F8;
  --tinta: #0F1E33; --tinta-2: #46576E; --linea: #C5CED9;
  --azul: #0A3D91; --sobre-azul: #FFFFFF;
  --amarillo: #FFD21F; --sobre-amarillo: #1A1500;
  --rojo: #B3261E; --sobre-rojo: #FFFFFF; --verde: #1C7A3A;
  --foco: #0A3D91; --panel: #0F1E33; --sobre-panel: #FFFFFF;
  --titulo: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --texto: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #0A1524; --superficie: #12243A; --superficie-2: #0E1D31;
    --tinta: #EAF0F7; --tinta-2: #9DB0C7; --linea: #27425F;
    --azul: #4A86F5; --sobre-azul: #06142B;
    --amarillo: #FFD21F; --sobre-amarillo: #1A1500;
    --rojo: #FF7A70; --sobre-rojo: #2A0603; --verde: #62D68D; --foco: #FFD21F; --panel: #050B14; --sobre-panel: #EAF0F7;
  }
}
:root[data-theme="dark"] {
  --fondo: #0A1524; --superficie: #12243A; --superficie-2: #0E1D31;
  --tinta: #EAF0F7; --tinta-2: #9DB0C7; --linea: #27425F;
  --azul: #4A86F5; --sobre-azul: #06142B;
  --amarillo: #FFD21F; --sobre-amarillo: #1A1500;
  --rojo: #FF7A70; --sobre-rojo: #2A0603; --verde: #62D68D; --foco: #FFD21F; --panel: #050B14; --sobre-panel: #EAF0F7;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100%; background: var(--fondo); color: var(--tinta); font-family: var(--texto); font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
h1, h2, h3 { font-family: var(--titulo); font-weight: 700; margin: 0; letter-spacing: 0.2px; line-height: 1.1; }
h2 { font-size: 26px; }
h3 { font-size: 21px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
.ayuda { color: var(--tinta-2); font-size: 15px; }
.centro { text-align: center; }

/* --- estructura --- */
#raiz { max-width: 560px; margin: 0 auto; min-height: 100vh; background: var(--superficie-2); padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
.cabecera { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 12px; background: var(--superficie); border-bottom: 1px solid var(--linea); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.chapa { display: inline-flex; flex-direction: column; min-width: 0; border: 3px solid var(--tinta); border-radius: 9px; background: #fff; overflow: hidden; color: #0B1220; box-shadow: 0 2px 0 var(--tinta); }
.chapa .banda { background: #0A3D91; color: #fff; font-family: var(--titulo); font-weight: 600; font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; text-align: center; padding: 1px 12px; }
.chapa .nombre { font-family: var(--titulo); font-weight: 800; font-size: 25px; line-height: 1; padding: 3px 12px 4px; text-transform: uppercase; letter-spacing: 1.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.engranaje { width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid var(--linea); border-radius: 50%; background: var(--superficie); text-decoration: none; color: var(--tinta); flex: none; }
.pantalla { padding: 18px 16px 8px; }
.bloque { margin-top: 26px; }
.bloque:first-child { margin-top: 0; }
.bloque > h3 { margin-bottom: 10px; }
.sub { margin: 4px 0 14px; }

/* --- tablero de contadores --- */
.tablero { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel); color: var(--sobre-panel); border: 1px solid var(--linea); border-radius: 10px; }
.tablero > div { padding: 14px 10px 12px; text-align: center; }
.tablero > div + div { border-left: 1px solid rgba(255,255,255,0.18); }
.tablero b { display: block; font-family: var(--titulo); font-size: 44px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.tablero span { font-size: 14px; opacity: 0.85; }

/* --- botones --- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border: 2px solid var(--tinta); border-radius: 10px; background: var(--superficie); font-weight: 600; text-decoration: none; color: var(--tinta); }
.btn.principal { background: var(--azul); color: var(--sobre-azul); border-color: var(--azul); font-size: 19px; }
.btn.peligro { border-color: var(--rojo); color: var(--rojo); }
.btn.chico { min-height: 44px; padding: 0 14px; font-size: 16px; }
.btn.lleno { width: 100%; }
.btn:disabled { opacity: 0.5; }
.fila-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

/* --- listas --- */
.lista { background: var(--superficie); border-top: 1px solid var(--linea); border-bottom: 1px solid var(--linea); margin: 0 -16px; }
.item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--linea); min-height: 62px; text-decoration: none; color: inherit; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.item:last-child { border-bottom: 0; }
.item .cuerpo { flex: 1; min-width: 0; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .s { color: var(--tinta-2); font-size: 15px; overflow-wrap: anywhere; }
.vacio { padding: 18px 16px; background: var(--superficie); border: 2px dashed var(--linea); border-radius: 10px; }
.vacio p + p, .vacio p + .btn, .vacio .btn { margin-top: 12px; }

/* --- estados --- */
.punto { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--verde); }
.punto.venc { background: var(--rojo); }
.punto.pronto { background: var(--amarillo); box-shadow: 0 0 0 2px var(--tinta); }
.punto.sin { background: transparent; border: 2px dashed var(--tinta-2); }
.etiqueta { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; background: var(--superficie-2); border: 1px solid var(--linea); }
.etiqueta.venc { background: var(--rojo); color: var(--sobre-rojo); border-color: var(--rojo); }
.etiqueta.pronto { background: var(--amarillo); color: var(--sobre-amarillo); border-color: var(--amarillo); }

/* --- checklist --- */
.segmento { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--tinta); border-radius: 10px; overflow: hidden; }
.segmento a { text-align: center; padding: 12px 6px; font-weight: 600; text-decoration: none; color: var(--tinta); background: var(--superficie); }
.segmento a[aria-current="true"] { background: var(--tinta); color: var(--superficie); }
.progreso { height: 10px; background: var(--linea); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
.progreso i { display: block; height: 100%; background: var(--verde); width: 0; transition: width .2s; }
.tilde { display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 64px; border: 0; border-bottom: 1px solid var(--linea); background: none; width: 100%; text-align: left; }
.tilde:last-child { border-bottom: 0; }
.tilde .caja { width: 32px; height: 32px; flex: none; border: 3px solid var(--tinta); border-radius: 8px; display: grid; place-items: center; background: var(--superficie); }
.tilde .caja svg { width: 22px; height: 22px; opacity: 0; }
.tilde[aria-checked="true"] .caja { background: var(--verde); border-color: var(--verde); }
.tilde[aria-checked="true"] .caja svg { opacity: 1; color: #fff; }
.tilde[aria-checked="true"] .texto { color: var(--tinta-2); text-decoration: line-through; text-decoration-thickness: 2px; }
.texto { flex: 1; font-weight: 500; overflow-wrap: anywhere; }
.editor { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--linea); }
.editor input { flex: 1; min-width: 0; }
.mini { width: 44px; height: 44px; border: 1px solid var(--linea); border-radius: 8px; background: var(--superficie); flex: none; }

/* --- formularios --- */
.campo { margin-top: 14px; }
.campo label, .campo .rotulo { display: block; font-weight: 600; margin-bottom: 4px; }
input[type=text], input[type=number], input[type=date], input[type=time], select, textarea { width: 100%; min-height: 50px; padding: 10px 12px; border: 2px solid var(--linea); border-radius: 10px; background: var(--superficie); color: var(--tinta); }
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--azul); }
.par { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
.cuatro { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 10px; }
.rueda { background: var(--superficie); border: 1px solid var(--linea); border-radius: 10px; padding: 10px; }
.rueda .rotulo { font-size: 15px; margin-bottom: 6px; }
.rueda .par { gap: 6px; }
.rueda input { min-height: 46px; padding: 6px 8px; }
.rueda small { display: block; color: var(--tinta-2); font-size: 13px; margin-top: 2px; }
.dictado { position: relative; }
.dictado textarea { padding-right: 58px; }
.mic { position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--linea); background: var(--superficie-2); display: grid; place-items: center; }
.mic.on { background: var(--rojo); border-color: var(--rojo); color: var(--sobre-rojo); animation: pulso 1s ease-in-out infinite; }
@keyframes pulso { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } .progreso i { transition: none; } }
.detalle dl { margin: 0; }
.detalle dt { color: var(--tinta-2); font-size: 15px; margin-top: 12px; }
.detalle dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; white-space: pre-wrap; }
.aviso { padding: 12px 14px; border-radius: 10px; background: var(--amarillo); color: var(--sobre-amarillo); font-weight: 600; margin-bottom: 14px; }
.cartel { padding: 12px 14px; border-radius: 10px; background: var(--superficie); border: 2px solid var(--verde); font-weight: 600; margin-top: 12px; }

/* --- barra de abajo --- */
.barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--superficie); border-top: 2px solid var(--tinta); padding-bottom: env(safe-area-inset-bottom, 0px); }
.barra nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.barra a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 2px 8px; min-height: 64px; text-decoration: none; color: var(--tinta-2); font-size: 13px; font-weight: 600; }
.barra a svg { width: 26px; height: 26px; }
.barra a[aria-current="true"] { color: var(--tinta); box-shadow: inset 0 4px 0 var(--azul); }
.barra a[aria-current="true"] svg { color: var(--azul); }

/* --- ventana y aviso corto --- */
.velo { position: fixed; inset: 0; z-index: 30; background: rgba(5, 12, 22, 0.62); display: grid; place-items: end center; padding: 16px; }
.ventana { width: 100%; max-width: 520px; background: var(--superficie); border: 2px solid var(--tinta); border-radius: 14px; padding: 18px; }
.ventana p { font-size: 18px; font-weight: 600; }
.ventana .acciones { margin-top: 16px; }
.ventana .acciones .btn { flex: 1; }
.toast { pointer-events: none; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--tinta); color: var(--superficie); padding: 12px 18px; border-radius: 10px; font-weight: 600; max-width: 90vw; }
.proxima { display: block; background: var(--panel); color: var(--sobre-panel); border: 1px solid var(--linea); border-radius: 10px; padding: 14px 16px; text-decoration: none; }
.proxima .cuando { display: block; font-family: var(--titulo); font-size: clamp(26px, 8.4vw, 36px); white-space: nowrap; line-height: 1.05; font-weight: 700; margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
.proxima .que { opacity: 0.88; font-size: 16px; }
.dia-titulo { margin: 22px 0 8px; }
.hora { font-family: var(--titulo); font-weight: 700; font-size: 26px; min-width: 66px; font-variant-numeric: tabular-nums; }
.hora.sin { color: var(--tinta-2); font-size: 16px; font-weight: 600; }
input[type=file] { width: 100%; min-height: 50px; padding: 10px 12px; border: 2px dashed var(--linea); border-radius: 10px; background: var(--superficie); }
.oculto { display: none !important; }
</style>
</head>

<script>
(function () {
'use strict';
var KEY = 'cuaderno-de-pista-v1';
var SVG_TILDE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
var SVG_MIC = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>';

/* ---------- utilidades ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function z2(n) { return String(n).padStart(2, '0'); }
function hoyISO() { var d = new Date(); return d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate()); }
function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
function aFecha(iso) { var p = String(iso).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function diasEntre(a, b) { return Math.round((aFecha(b) - aFecha(a)) / 86400000); }
function sumarMeses(iso, m) { var d = aFecha(iso), dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + m); var ult = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(dia, ult)); return d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate()); }
function fechaCorta(iso) { if (!iso) return ''; var p = String(iso).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function fmt(n) { n = Number(n) || 0; return Number.isInteger(n) ? String(n) : (Math.round(n * 10) / 10).toString().replace('.', ','); }
function num(v) { var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; }
function plural(n, uno, varios) { return n === 1 ? uno : varios; }
function parseTiempo(s) {
  s = String(s || '').trim().replace(',', '.'); if (!s) return null;
  var m = s.match(/^(?:(\d+):)?(\d{1,2}(?:\.\d{1,3})?)$/); if (!m) return null;
  var min = m[1] ? +m[1] : 0, seg = parseFloat(m[2]); if (seg >= 60 && m[1]) return null;
  return Math.round((min * 60 + seg) * 1000);
}
function mostrarTiempo(ms) { var m = Math.floor(ms / 60000), s = (ms - m * 60000) / 1000; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3); }

/* ---------- datos ---------- */
function listaAntes() { return ['Tuercas de las ruedas ajustadas con torquímetro', 'Presión de los neumáticos', 'Nivel de aceite del motor', 'Nivel de agua', 'Nivel de líquido de frenos', 'Estado de pastillas y discos', 'Pérdidas de aceite, agua o combustible', 'Cinturones y asiento', 'Casco, mono y guantes', 'Extintor y corta corriente', 'Combustible cargado', 'Nada suelto dentro del auto']; }
function listaDespues() { return ['Presiones en caliente anotadas', 'Nivel de aceite y de agua', 'Pérdidas de aceite, agua o combustible', 'Desgaste y daños en los neumáticos', 'Estado de los frenos', 'Tuercas de las ruedas', 'Golpes o daños en la carrocería', 'Km y notas de la salida cargados']; }
function items(lista) { return lista.map(function (t) { return { id: uid(), t: t }; }); }
function nuevoEstado() {
  return {
    v: 1, tema: 'auto',
    auto: { nombre: 'Falcon', categoria: 'TC Regional' },
    unidadPresion: 'psi', avisoPct: 80, avisoDias: 30,
    contadores: { salidas: 0, km: 0, horas: 0 },
    checklists: { antes: items(listaAntes()), despues: items(listaDespues()) },
    marcas: { antes: {}, despues: {} },
    tareas: [], salidas: [], fechas: []
  };
}
var S, almacenOK = true;
function migrar(o) {
  var b = nuevoEstado();
  if (!o || typeof o !== 'object') return b;
  ['tema', 'unidadPresion', 'avisoPct', 'avisoDias'].forEach(function (k) { if (o[k] != null) b[k] = o[k]; });
